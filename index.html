
<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Guess the Number</title>
  <style>
    body { font-family: sans-serif; text-align: center; margin-top: 60px; }
    input, button { font-size: 20px; padding: 8px; }
  </style>
</head>
<body>
  <h1>Guess the number (1-100)</h1>
  <input id="guess" type="number">
  <button onclick="check()">Guess</button>
  <p id="message"></p>

  <script>
    let secret = Math.floor(Math.random() * 100) + 1;
    let tries = 0;

    function check() {
      const g = Number(document.getElementById("guess").value);
      tries++;
      const msg = document.getElementById("message");
      if (g === secret) {
        msg.textContent = "Correct! You took " + tries + " tries.";
        secret = Math.floor(Math.random() * 100) + 1;
        tries = 0;
      } else if (g < secret) {
        msg.textContent = "Too low!";
      } else {
        msg.textContent = "Too high!";
      }
    }
  </script>
</body>
</html>
